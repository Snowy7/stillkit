# Fast dev loop (nightly, see rust-toolchain.toml). Dev-only; release builds use plain LLVM.

[unstable]
codegen-backend = true

[build]
rustflags = ["-Zthreads=8", "-Zshare-generics=y"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Cranelift compiles our crates; dependencies stay on LLVM (optimized, built once).
[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"

[profile.release]
codegen-backend = "llvm"
