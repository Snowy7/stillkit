[package]
name = "stillkit"
description = "A native UI library: CPU-drawn surfaces that redraw only what changed and never wake when idle."
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

keywords = ["gui", "native", "wayland", "windows", "declarative"]
categories = ["gui", "rendering"]
readme = "../../README.md"
rust-version = "1.96"

[package.metadata.stillkit]
# The crates build on stable (rust-version, verified with 1.96 and 1.99.1); this repo's own
# dev loop uses nightly for Cranelift (rust-toolchain.toml), which downstream builds never need.
toolchain = "nightly"
verified-rustc-commit-date = "2026-11-02"

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
log.workspace = true
# Golden-image comparison (`golden` feature), for tests in this crate and the shell.
png = { workspace = true, optional = true }
unicode-segmentation = "1.12"
taffy = { version = "0.15.1", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }

[features]
serde = ["dep:serde", "dep:serde_json", "dep:toml"]
golden = ["dep:png"]
# GPU mode (`platform::Render::Gpu`, docs/ui.md "Render modes"): hardware Direct2D on
# DirectComposition and in-process Liquid Glass (wgpu DX12). Without it no GPU code is compiled.
gpu = ["dep:wgpu", "dep:stillkit-glass", "dep:vello_hybrid", "dep:pollster", "dep:raw-window-handle", "wayland-client/system", "wayland-client/dlopen"]

[target.'cfg(windows)'.dependencies]
accesskit_windows.workspace = true
windows-numerics.workspace = true
windows-core.workspace = true
stillkit-glass = { path = "../stillkit-glass", optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"], optional = true }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  # DirectComposition sprites (`compose`), on a WARP Direct3D 11 device.
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  # The system clipboard (`clipboard::System`).
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  # The spike's clock (GetSystemTimePreciseAsFileTime).
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Controls_RichEdit",
  "Win32_UI_Input_Ime",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # The CPU-mode system backdrop (`system_backdrop`): DWM's host backdrop blur through
  # Windows.UI.Composition, and the transparency setting it follows.
  "System",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
]

[dev-dependencies]
png.workspace = true
# Builds and parses the D-Bus messages that check the AT-SPI status codec
# (platform/linux/a11y_bus.rs) on every host. Test-only; the Linux build already has zbus
# through accesskit_unix.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

# `glass_measure` reads per-process GPU memory counters.
[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = ["Win32_System_Performance"]

# Render modes measured (docs/ui.md, "Render modes").
[[example]]
name = "glass_measure"
required-features = ["gpu"]

# The N0.1 spike: a 3840x36 bar surface, measured live (docs/ui.md).
[[example]]
name = "stillkit-bar-spike"
path = "examples/bar_spike.rs"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "0.24.1"
# Vello Hybrid was renamed vello_gpu in 0.3 (same common scene API and wgpu 30).
vello_hybrid = { package = "vello_gpu", version = "0.3", default-features = false, features = ["std", "wgpu", "text"], optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"], optional = true }
stillkit-glass = { path = "../stillkit-glass", optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
cosmic-text = { version = "0.19", features = ["peniko"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xkbcommon-dl = "0.4"
skrifa = "0.44"

# macOS (docs/ui.md, "macOS backend"): AppKit windows, CoreGraphics and CoreText drawing, ImageIO
# decoding and AccessKit's NSAccessibility adapter. Metal (wgpu) only with `gpu`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-text = "=0.3.2"
objc2-quartz-core = "=0.3.2"
objc2-image-io = "=0.3.2"
accesskit_macos = "=0.27.2"
# GPU mode draws glyph outlines from CoreText, so no `text` feature (no second font stack).
vello_hybrid = { package = "vello_gpu", version = "=0.3.0", default-features = false, features = ["std", "wgpu"], optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"], optional = true }
stillkit-glass = { path = "../stillkit-glass", optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[[example]]
name = "gallery"
test = true

# CPU mode loads no Metal driver (macOS). AppKit windows need the main thread, so the test
# has its own `main` instead of the harness's worker threads.
[[test]]
name = "macos_no_gpu_driver"
harness = false

# Waking the UI thread's wait from another thread needs a main-thread event queue.
[[test]]
name = "waker"
harness = false
