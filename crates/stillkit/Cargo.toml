[package]
name = "stillkit"
description = "A native UI library: CPU-drawn surfaces that redraw only what changed and never wake when idle."
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
log.workspace = true
# Golden-image comparison (`golden` feature), for tests in this crate and the shell.
png = { workspace = true, optional = true }

[features]
golden = ["dep:png"]

[target.'cfg(windows)'.dependencies]
accesskit_windows.workspace = true
windows-numerics.workspace = true
windows-core.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  # DirectComposition sprites (`compose`), on a WARP Direct3D 11 device.
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  # The spike's clock (GetSystemTimePreciseAsFileTime).
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Controls_RichEdit",
  "Win32_UI_Input_Ime",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
png.workspace = true

# The N0.1 spike: a 3840x36 bar surface, measured live (docs/ui.md).
[[example]]
name = "stillkit-bar-spike"
path = "examples/bar_spike.rs"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
cosmic-text = { version = "0.19", features = ["peniko"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xkbcommon-dl = "0.4"
