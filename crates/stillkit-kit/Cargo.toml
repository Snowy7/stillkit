[package]
name = "stillkit-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Declarative components for stillkit"

keywords = ["gui", "widgets", "components", "native", "stillkit"]
categories = ["gui"]
readme = "README.md"
rust-version = "1.96"

[package.metadata.stillkit]
# The crates build on stable (rust-version, verified with 1.96 and 1.99.1); this repo's own
# dev loop uses nightly for Cranelift (rust-toolchain.toml), which downstream builds never need.
toolchain = "nightly"
verified-rustc-commit-date = "2026-11-02"

[features]
default = []
markdown = ["dep:pulldown-cmark"]

[dependencies]
stillkit = { path = "../stillkit" }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
stillkit = { path = "../stillkit", features = ["golden"] }
anyhow.workspace = true

[lints]
workspace = true
