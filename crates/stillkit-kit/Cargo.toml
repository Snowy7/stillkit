[package]
name = "stillkit-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Declarative components for stillkit"

keywords = ["gui", "widgets", "components", "native", "stillkit"]
categories = ["gui"]
readme = "README.md"
rust-version = "1.101"

[package.metadata.stillkit]
# Cargo requires a numeric rust-version, not a nightly date.
toolchain = "nightly"
verified-rustc-commit-date = "2026-11-02"

[dependencies]
stillkit = { path = "../stillkit" }

[dev-dependencies]
stillkit = { path = "../stillkit", features = ["golden"] }
anyhow.workspace = true

[lints]
workspace = true
