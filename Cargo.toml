[package]
name = "mypaper-ui"
description = "The native UI layer: layered-window surfaces drawn with software Direct2D and DirectWrite."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
accesskit.workspace = true
accesskit_windows.workspace = true
anyhow.workspace = true
log.workspace = true
windows-numerics.workspace = true
# Golden-image comparison (`golden` feature), for tests in this crate and the shell.
png = { workspace = true, optional = true }

[features]
golden = ["dep:png"]

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  # The spike's clock (GetSystemTimePreciseAsFileTime).
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
png.workspace = true

# The N0.1 spike: a 3840x36 bar surface, measured live (docs/ui.md). Named like the product's
# processes so `measure.ps1` picks it up.
[[example]]
name = "mypaper-bar-spike"
path = "examples/bar_spike.rs"

[lints]
workspace = true
