[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Snowy7/stillkit"

[workspace.dependencies]
# Accessibility: the platform adapters share AccessKit's tree types.
accesskit = "0.25"
accesskit_windows = "0.35"
# Direct2D takes its points as `Vector2`; the version `windows` 0.62 already uses.
windows-numerics = "0.3"
windows = "0.62"
windows-core = "0.62"
# Golden-image tests (`golden` feature).
png = "0.18"
anyhow = "1"
log = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The vendored adapter (crates/stillkit/vendor/accesskit_windows). Apps that depend on stillkit
# need the same patch in their own workspace: Cargo applies only the root workspace's patches.
[patch.crates-io]
accesskit_windows = { path = "crates/stillkit/vendor/accesskit_windows" }
